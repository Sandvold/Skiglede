name: Last opp løyper til Neon

# Appen henter løypene fra tabellen `loype` i Neon (bare de som blir sett på). Denne jobben kjører når løypefilene endres, og trigger ikke Netlify-bygg.
on:
  push:
    branches: [main]
    paths:
      - 'src/data/trails*.json'
      - 'src/data/omrader.sql'
      - 'scripts/last_opp_loyper.py'
      - 'scripts/kontroller-loyper.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: last-opp-loyper
  cancel-in-progress: false

jobs:
  loyper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install psycopg2-binary
      - name: Kontroller løyper (dårlige settes i karantene)
        run: node scripts/kontroller-loyper.mjs --karantene karantene.json
      - name: Last opp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -I scripts/last_opp_loyper.py --karantene karantene.json
