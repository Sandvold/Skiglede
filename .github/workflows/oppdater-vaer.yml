name: Oppdater værhistorikk

# Henter siste 14 døgn fra MET Nordic Analysis hver fjerde time (minutt 17 UTC) for alle områder i tabellen `omrade` i Neon,
# og laster det opp til tabellen `vaer`. Bare nye timer hentes fra MET. Appen leser fra databasen, så ingenting committes og Netlify bygger ikke på nytt.
# Nytt område: legg en rad i `omrade` (se docs/regelspesifikasjon.md). Krever hemmeligheten DATABASE_URL (rollen vaer_skriver).
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oppdater-vaer
  cancel-in-progress: false

jobs:
  vaer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pyproj psycopg2-binary
      - name: Oppdater værhistorikk
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -I scripts/oppdater_vaer.py
