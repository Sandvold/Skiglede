name: Oppdater værhistorikk

# Henter siste 14 døgn fra MET Nordic Analysis hver fjerde time (minutt 17 UTC) for alle områder i tabellen `omrade` i Neon,
# og laster det opp til tabellen `vaer`. Bare nye timer hentes fra MET. Appen leser fra databasen, så ingenting committes og Netlify bygger ikke på nytt.
# Nytt område: legg en rad i `omrade` (se docs/regelspesifikasjon.md). Krever hemmeligheten DATABASE_URL (rollen vaer_skriver).
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oppdater-vaer
  cancel-in-progress: false

jobs:
  vaer:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # normalt ca. 6 min; stopp heller enn å blokkere neste kjøring i timevis hvis MET henger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pyproj psycopg2-binary netCDF4
      - name: Oppdater værhistorikk
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}  # valgfri: abonnement (kommersiell bruk) gir egen kvote
          OPEN_METEO_URL: ${{ secrets.OPEN_METEO_URL }}
        run: python3 -I scripts/oppdater_vaer.py
      - name: Oppdater snødybde og skiføre (seNorge, daglig)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -I scripts/oppdater_snoe.py
